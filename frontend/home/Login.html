<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Lens - Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100vh; width: 100vw; overflow: hidden; }

        .main-container {
            height: 100vh; width: 100%;
            background: url('images/home_bg.png') no-repeat center center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center; position: relative;
        }

        .top-logo { position: absolute; top: 20px; width: 200px; }
        .chef-left { position: absolute; top: 10%; left: 25%; width: 220px; }
        .chef-right { position: absolute; bottom: 5%; right: 25%; width: 300px; }

        .auth-card {
            width: 380px; background: rgba(0, 85, 110, 0.75);
            backdrop-filter: blur(12px); border-radius: 25px; padding: 30px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .tab-container {
            display: flex; background: rgba(0, 0, 0, 0.3);
            border-radius: 20px; position: relative; margin-bottom: 25px;
            width: 220px; height: 40px; cursor: pointer;
        }

        .tab { flex: 1; text-align: center; line-height: 40px; color: #79d7ed; font-weight: bold; z-index: 2; transition: color 0.3s; }
        .tab.active { color: white; }

        .glider {
            position: absolute; height: 100%; width: 50%;
            background: rgba(255, 255, 255, 0.15); border-radius: 20px;
            transition: transform 0.3s ease-in-out; z-index: 1;
        }

        .form-body { width: 100%; }
        .input-group { margin-bottom: 15px; text-align: center; position: relative; }
        .input-group label { display: block; color: #79d7ed; font-size: 0.8rem; margin-bottom: 5px; }
        
        /* Input Styling */
        .input-group input {
            width: 100%; padding: 10px 40px 10px 10px; border-radius: 8px; border: none;
            background: rgba(255, 255, 255, 0.2); color: white; text-align: center; outline: none;
        }

        /* Eye Icon Positioning */
        .toggle-password {
            position: absolute;
            right: 15px;
            bottom: 10px;
            color: #79d7ed;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .confirm-group.hidden { height: 0; margin: 0; opacity: 0; overflow: hidden; pointer-events: none; }

        .submit-btn {
            margin-top: 15px; width: 100%; padding: 12px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background: rgba(255, 255, 255, 0.2); }

        #error-msg { color: #ff9999; font-size: 0.8rem; margin-top: 10px; text-align: center; min-height: 1.2rem; }
        .footer-quote { margin-top: 30px; color: white; font-size: 0.75rem; font-style: italic; opacity: 0.8; text-align: center; }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="images/RL logo.png" class="top-logo">
        <img src="images/Login Img 2.png" class="chef-left">
        <img src="images/Login Img 1.png" class="chef-right">

        <div class="auth-card">
            <div class="tab-container" onclick="toggleAuth()">
                <div class="glider" id="glider"></div>
                <div class="tab active" id="sign-up-tab">Sign Up</div>
                <div class="tab" id="log-in-tab">Log In</div>
            </div>

            <div class="form-body">
                <div class="input-group">
                    <label>Gmail ID</label>
                    <input type="email" id="email" placeholder="email@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="toggleVisibility('password', this)"></i>
                </div>

                <div class="input-group confirm-group" id="confirm-field">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat password">
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="toggleVisibility('confirm-password', this)"></i>
                </div>

                <button class="submit-btn" id="main-button" onclick="handleSubmit()">Enter The Kitchen</button>
                <p id="error-msg"></p>
            </div>

            <p class="footer-quote">If you smell what the Chef is Cooking !</p>
        </div>
    </div>

    <script>
        let isSignUp = true; 
        const BACKEND_URL = "http://127.0.0.1:5000";

        // Logic to switch between Sign Up and Log In
        function toggleAuth() {
            isSignUp = !isSignUp;
            const glider = document.getElementById('glider');
            const confirmField = document.getElementById('confirm-field');
            const signUpTab = document.getElementById('sign-up-tab');
            const logInTab = document.getElementById('log-in-tab');
            const mainBtn = document.getElementById('main-button');

            if (isSignUp) {
                glider.style.transform = 'translateX(0%)';
                confirmField.classList.remove('hidden');
                signUpTab.classList.add('active');
                logInTab.classList.remove('active');
                mainBtn.innerText = "Enter The Kitchen";
            } else {
                glider.style.transform = 'translateX(100%)';
                confirmField.classList.add('hidden');
                signUpTab.classList.remove('active');
                logInTab.classList.add('active');
                mainBtn.innerText = "Welcome Back Chef";
            }
        }

        // NEW: Toggle Password Visibility
        function toggleVisibility(id, icon) {
            const field = document.getElementById(id);
            if (field.type === "password") {
                field.type = "text";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            } else {
                field.type = "password";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            }
        }

        async function handleSubmit() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.innerText = "";

            if (!email || !password) {
                errorMsg.innerText = "Please fill in all fields.";
                return;
            }

            if (isSignUp && password !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match!";
                return;
            }

            const endpoint = isSignUp ? "/register" : "/login";

            try {
                const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("isLoggedIn", "true");
                    window.location.href = "home.html";
                } else {
                    errorMsg.innerText = data.error || "Authentication failed";
                }
            } catch (err) {
                errorMsg.innerText = "Server is not responding. Check if Flask is running.";
            }
        }
    </script>
</body>
</html>
